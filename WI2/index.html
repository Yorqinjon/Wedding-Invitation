<title>Yorqinjon &amp; Sevara</title>

<style>
:root {
  /* Layout: a letter on linen. Envelope + wax seal opener, deckled paper hero with a leaf wreath, paper cards (calendar, postcard) on linen. */
  --linen: #f2eae1;
  --paper: #fffcf7;
  --blush: #ecd7cd;
  --rose: #a9616c;
  --sage: #74866a;
  --wax: #7b1e2b;
  --ink: #3a2e2b;
  --ink-2: #66574f;
  --script: "Great Vibes", "Segoe Script", "Brush Script MT", cursive;
  --serif: "Playfair Display", Georgia, "Times New Roman", serif;
  --sans: "Raleway", "Segoe UI", Roboto, Arial, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --edge: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='14' viewBox='0 0 160 14'><path d='M0 0H160V8L152 8.4L144 10.3L136 9L128 6.3L120 9L112 8.1L104 10.1L96 8.1L88 11L80 6.8L72 6.9L64 10.1L56 5.6L48 5.9L40 8.9L32 8.8L24 7.5L16 8.5L8 6.8L0 8Z'/></svg>");
  --weave: repeating-linear-gradient(0deg, rgba(120, 90, 70, .035) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(120, 90, 70, .03) 0 1px, transparent 1px 3px);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html.is-locked, html.is-locked body { overflow: hidden; }
body {
  margin: 0; background: var(--linen); color: var(--ink);
  font-family: var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  background-image: var(--weave);
}
body:has(#gate:not([hidden])) { overflow: hidden; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }

/* ---------- floating controls ---------- */
.hud {
  position: fixed; z-index: 80;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  left: max(14px, env(safe-area-inset-left, 0px));
  right: max(14px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: center; pointer-events: none;
}
.hud > * { pointer-events: auto; }
.chip { background: rgba(255, 252, 247, .78); border: 1px solid rgba(169, 97, 108, .35); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 6px 18px -10px rgba(90, 50, 40, .35); }
.btn-music { width: 44px; height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; color: var(--wax); cursor: pointer; }
.btn-music svg { grid-area: 1 / 1; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: opacity .3s, transform .3s; }
.eq { grid-area: 1 / 1; display: flex; align-items: flex-end; gap: 3px; height: 16px; opacity: 0; transition: opacity .3s; }
.eq i { width: 2.5px; height: 100%; border-radius: 2px; background: var(--wax); transform-origin: bottom; transform: scaleY(.25); }
.music-on .btn-music svg { opacity: 0; transform: scale(.6); }
.music-on .eq { opacity: 1; }
.music-on .eq i { animation: eq 1s ease-in-out infinite; }
.music-on .eq i:nth-child(2) { animation-duration: .8s; animation-delay: -.3s; }
.music-on .eq i:nth-child(3) { animation-duration: 1.15s; animation-delay: -.6s; }
.music-on .eq i:nth-child(4) { animation-duration: .9s; animation-delay: -.15s; }
@keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
.lang { display: flex; padding: 3px; border-radius: 999px; }
.lang button { border: 0; background: transparent; color: var(--wax); cursor: pointer; font: 600 11px/1 var(--sans); letter-spacing: .14em; padding: 12px 12px 12px 13px; min-width: 44px; border-radius: 999px; transition: background .3s, color .3s; }
.lang button[aria-pressed="true"] { background: var(--wax); color: var(--paper); }

/* ---------- petals ---------- */
.petals { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.petal { position: absolute; top: -30px; left: var(--x); animation: fall var(--dur) linear var(--delay) infinite; }
.petal b { display: block; animation: sway var(--sw) ease-in-out infinite alternate; }
.petal i { display: block; width: var(--s); height: calc(var(--s) * .78); border-radius: 150% 0 150% 0; background: linear-gradient(135deg, #f6e1db, #d8a0a8 70%, #c48390); opacity: .85; animation: flutter var(--fl) ease-in-out infinite alternate; }
@keyframes fall { to { transform: translate3d(0, calc(100vh + 60px), 0); } }
@keyframes sway { from { transform: translateX(-22px); } to { transform: translateX(22px); } }
@keyframes flutter { from { transform: rotate(0) rotateX(0); } to { transform: rotate(200deg) rotateX(65deg); } }

/* ---------- gate: envelope ---------- */
.gate {
  position: fixed; inset: 0; z-index: 50; overflow: hidden; touch-action: none;
  display: grid; place-items: center;
  background: radial-gradient(120% 90% at 50% 45%, #f7f0e8 0%, #efe5da 60%, #e6d8cb 100%);
  padding-block: calc(env(safe-area-inset-top, 0px) + 70px) calc(env(safe-area-inset-bottom, 0px) + 40px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.gate::before { content: ""; position: absolute; inset: 0; background-image: var(--weave); pointer-events: none; }
.gate-in { position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; }
.kicker { margin: 0 0 30px; font: 400 clamp(38px, 11.5vw, 48px)/1.1 var(--script); color: var(--rose); opacity: 0; animation: fadeUp 1.1s .2s var(--ease) forwards; transition: opacity .5s; }
.env {
  --w: min(86vw, 360px);
  position: relative; width: var(--w); height: calc(var(--w) * .66);
  perspective: 1100px;
  opacity: 0; animation: envIn 1.2s .45s var(--ease) forwards;
}
@keyframes envIn { from { opacity: 0; transform: translateY(40px) rotate(-2deg); } to { opacity: 1; transform: none; } }
.env-back {
  position: absolute; inset: 0; border-radius: 6px;
  background: radial-gradient(rgba(255, 255, 255, .28) 1px, transparent 1.6px) 0 0 / 11px 11px, linear-gradient(#d8b1a4, #cc9e90);
  box-shadow: 0 30px 50px -26px rgba(90, 45, 35, .5), 0 2px 6px rgba(90, 45, 35, .12);
}
.letter {
  position: absolute; z-index: 2; left: 5%; right: 5%; top: 6%; height: 88%;
  background: var(--paper); border-radius: 3px;
  box-shadow: 0 1px 3px rgba(90, 50, 40, .18);
  display: flex; flex-direction: column; align-items: center; padding-top: 7%;
  transition: transform 1.05s var(--ease);
}
.letter > * { transition: opacity .5s; }
.l-eyebrow { margin: 0 0 4px; font: 600 8.5px/1.3 var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--rose); }
.l-names { margin: 0; font: 400 30px/1.2 var(--script); color: var(--ink); white-space: nowrap; }
.l-names i { font: italic 400 18px/1 var(--serif); color: var(--rose); padding: 0 .3em; vertical-align: .12em; }
.l-date { margin: 2px 0 0; font: italic 400 13px/1 var(--serif); letter-spacing: .14em; color: var(--ink-2); }
.pocket { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.pk { position: absolute; inset: 0; filter: drop-shadow(0 0 .6px rgba(120, 70, 60, .5)) drop-shadow(0 -2px 3px rgba(120, 70, 60, .08)); }
.pk i { position: absolute; inset: 0; border-radius: 6px; }
.pk-l i { clip-path: polygon(0 0, 53% 55%, 0 100%); background: linear-gradient(100deg, #f2e3da, #ead4c9); }
.pk-r i { clip-path: polygon(100% 0, 47% 55%, 100% 100%); background: linear-gradient(260deg, #f2e3da, #ead4c9); }
.pk-b i { clip-path: polygon(0 100%, 50% 44%, 100% 100%); background: linear-gradient(0deg, #f7ebe3, #efdcd2); }
.env-to { position: absolute; z-index: 3; left: 0; right: 0; bottom: 11%; margin: 0; font: 400 22px/1 var(--script); color: var(--ink-2); pointer-events: none; transition: opacity .4s; }
.flap { position: absolute; z-index: 4; left: 0; top: 0; width: 100%; height: 58%; transform-origin: 50% 0; transform-style: preserve-3d; transition: transform .95s cubic-bezier(.5, .05, .25, 1); }
.flap i { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; clip-path: polygon(0 0, 100% 0, 50% 100%); border-radius: 6px 6px 0 0; }
.flap .f { background: linear-gradient(180deg, #f5e8e0, #ead5ca); }
.flap .b { transform: rotateY(180deg); background: radial-gradient(rgba(255, 255, 255, .28) 1px, transparent 1.6px) 0 0 / 11px 11px, linear-gradient(#cfa496, #d8b1a4); }
.flap-shadow { position: absolute; z-index: 4; left: 0; top: 0; width: 100%; height: 58%; pointer-events: none; filter: drop-shadow(0 2px 2px rgba(110, 60, 50, .22)); transition: opacity .3s; }
.flap-shadow i { position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 50% 100%); background: #ead5ca; }
.seal {
  position: absolute; z-index: 6; left: 50%; top: 58%; width: 84px; height: 84px; margin: -42px 0 0 -42px;
  padding: 0; border: 0; background: none; cursor: pointer; border-radius: 50%;
}
.seal::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid rgba(123, 30, 43, .45); opacity: 0; animation: pulse 2.4s 2.2s var(--ease) infinite; }
.seal-half { position: absolute; inset: 0; transition: transform .9s cubic-bezier(.3, .6, .3, 1), opacity .8s ease; filter: drop-shadow(0 4px 5px rgba(70, 15, 25, .35)); }
.seal-half svg { width: 100%; height: 100%; display: block; overflow: visible; }
.seal-half.l { clip-path: polygon(0 0, 54% 0, 47% 38%, 55% 60%, 46% 100%, 0 100%); }
.seal-half.r { clip-path: polygon(54% 0, 100% 0, 100% 100%, 46% 100%, 55% 60%, 47% 38%); }
.seal:hover .seal-half { transform: scale(1.04); }
.gate-hint { margin: 34px 0 0; display: inline-flex; align-items: center; gap: 10px; font: 600 11px/1 var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--wax); opacity: 0; animation: fadeIn 1s 1.9s forwards; transition: opacity .4s; }
.gate-hint::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--wax); animation: blink 1.6s ease-in-out infinite; }
.gate-names { margin: 18px 0 0; font: italic 400 15px/1 var(--serif); letter-spacing: .06em; color: var(--ink-2); opacity: 0; animation: fadeIn 1.2s 2.2s forwards; transition: opacity .4s; }

/* open sequence */
.s1 .seal::before { animation: none; opacity: 0; }
.s1 .seal-half.l { transform: translate(-34px, 70px) rotate(-38deg); opacity: 0; }
.s1 .seal-half.r { transform: translate(34px, 74px) rotate(32deg); opacity: 0; }
.s1 .flap { transform: rotateX(180deg); }
.s1 .flap-shadow { opacity: 0; }
.flap-under .flap { z-index: 1; }
.s1 .gate-hint { animation: fadeIn 1s 1.9s forwards, fadeOut .4s forwards; }
.s1 .gate-names { animation: fadeIn 1.2s 2.2s forwards, fadeOut .4s forwards; }
.s2 .kicker { animation: fadeUp 1.1s .2s var(--ease) forwards, fadeOut .45s forwards; }
.s2 .letter { transform: translateY(-56%); }
.s3 .env-to { opacity: 0; }
.s3 .letter > * { opacity: 0; }
.s3 .env-back, .s3 .pocket, .s3 .flap { transition: transform .9s var(--ease), opacity .7s ease; transform: translateY(46%); opacity: 0; }
.s3 .flap { transform: translateY(46%) rotateX(180deg); }
.flood { position: fixed; z-index: 60; background: var(--paper); border-radius: 3px; pointer-events: none; transition: left .95s cubic-bezier(.65, 0, .25, 1), top .95s cubic-bezier(.65, 0, .25, 1), width .95s cubic-bezier(.65, 0, .25, 1), height .95s cubic-bezier(.65, 0, .25, 1), border-radius .95s, opacity .8s ease; }
.flood.grow { left: 0 !important; top: 0 !important; width: 100vw !important; height: 100vh !important; border-radius: 0; }
.flood.fade { opacity: 0; }
.gate.fade-out { transition: opacity .7s ease; opacity: 0; }

/* ---------- hero (letter page) ---------- */
.hero {
  position: relative; overflow: hidden;
  min-height: 100vh; min-height: 100svh;
  display: grid; place-items: center; text-align: center;
  background: radial-gradient(70% 45% at 0% 0%, rgba(236, 215, 205, .55), transparent 70%), radial-gradient(70% 45% at 100% 100%, rgba(236, 215, 205, .55), transparent 70%), var(--paper);
  padding-block: 80px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 12px) no-repeat, var(--edge) bottom / 160px 14px repeat-x;
  mask: linear-gradient(#000 0 0) top / 100% calc(100% - 12px) no-repeat, var(--edge) bottom / 160px 14px repeat-x;
}
.sprig { position: absolute; width: min(48vw, 220px); height: auto; pointer-events: none; overflow: visible; }
.sprig.tl { left: -14px; top: -6px; transform-origin: 0 0; }
.sprig.br { right: -14px; bottom: 4px; transform: rotate(180deg); transform-origin: 50% 50%; }
.hero-go .sprig.tl { animation: swayA 7s ease-in-out infinite alternate; }
.sprig .stem { fill: none; stroke: var(--sage); stroke-width: 1.2; stroke-linecap: round; stroke-dasharray: 1 2; stroke-dashoffset: 1.01; }
.sprig .lf path { fill: rgba(116, 134, 106, .16); stroke: var(--sage); stroke-width: .9; transform: scale(0); }
.hero-go .sprig .stem { animation: draw 1.8s .3s var(--ease) forwards; }
.hero-go .sprig .lf path { animation: leafIn .7s var(--ease) forwards; animation-delay: calc(.6s + var(--i) * 90ms); }
@keyframes swayA { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }
.hero-in { position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; align-items: center; will-change: transform, opacity; }
.h-eyebrow { margin: 0 0 6px; padding-left: .3em; font: 600 10.5px/1.4 var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--rose); opacity: 0; }
.hero-go .h-eyebrow { animation: fadeIn 1.2s .3s forwards; }
.wreath-box { position: relative; width: min(86vw, 340px); aspect-ratio: 1; display: grid; place-items: center; container-type: inline-size; }
.wreath { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.wreath .stem { fill: none; stroke: var(--sage); stroke-width: 1.1; stroke-linecap: round; stroke-dasharray: 1 2; stroke-dashoffset: 1.01; }
.wreath .lf path { fill: rgba(116, 134, 106, .14); stroke: var(--sage); stroke-width: .85; transform: scale(0); }
.wreath .berry circle { fill: var(--rose); transform: scale(0); }
.hero-go .wreath .stem { animation: draw 2.2s .2s var(--ease) forwards; }
.hero-go .wreath .lf path, .hero-go .wreath .berry circle { animation: leafIn .65s var(--ease) forwards; animation-delay: calc(.35s + var(--i) * 55ms); }
@keyframes leafIn { to { transform: scale(1); } }
.names { position: relative; margin: 0; display: flex; flex-direction: column; align-items: center; font-weight: 400; }
.nm { display: block; white-space: nowrap; font: 400 clamp(44px, 14vw, 58px)/1.05 var(--script); font-size: 16.5cqi; color: var(--ink); padding: 0 .12em; clip-path: inset(-30% 104% -30% -6%); }
.hero-go .nm { animation: write 1.5s cubic-bezier(.55, .1, .35, 1) forwards; animation-delay: .5s; }
.hero-go .nm + .amp + .nm { animation-delay: 1.4s; }
@keyframes write { to { clip-path: inset(-30% -6% -30% -6%); } }
.amp { display: block; margin: -2px 0; font: italic 400 26px/1 var(--serif); font-size: 8cqi; color: var(--rose); opacity: 0; }
.hero-go .amp { animation: popIn .8s 1.2s var(--ease) forwards; }
.h-date { margin: 4px 0 6px; font: italic 400 clamp(22px, 6.4vw, 26px)/1.2 var(--serif); color: var(--ink); opacity: 0; }
.h-day { margin: 0; padding-left: .26em; font: 600 11px/1 var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--rose); opacity: 0; font-variant-numeric: lining-nums; }
.hero-go .h-date { animation: fadeUp 1s 2.4s var(--ease) forwards; }
.hero-go .h-day { animation: fadeUp 1s 2.6s var(--ease) forwards; }
.cue { position: absolute; z-index: 1; left: 50%; bottom: 40px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--ink-2); text-decoration: none; font: 600 10px/1 var(--sans); letter-spacing: .3em; text-transform: uppercase; padding-left: .3em; opacity: 0; }
.hero-go .cue { animation: fadeIn 1s 3s forwards; }
.cue svg { width: 16px; height: 16px; fill: none; stroke: var(--rose); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; animation: bob 1.8s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(5px); } }

/* ---------- sections ---------- */
.sec { position: relative; padding-block: 64px; }
.wrap { position: relative; max-width: 460px; margin: 0 auto; text-align: center; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.eyebrow { margin: 0 0 12px; padding-left: .3em; font: 600 10.5px/1.3 var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--rose); }
.h { margin: 0 0 18px; font: italic 400 clamp(30px, 8.6vw, 38px)/1.15 var(--serif); color: var(--ink); text-wrap: balance; }
.lead { max-width: 33ch; margin: 0 auto 14px; font: 400 16px/1.75 var(--sans); color: var(--ink-2); text-wrap: pretty; }
.accent { max-width: 24ch; margin: 24px auto 0; font: italic 500 21px/1.4 var(--serif); color: var(--wax); text-wrap: balance; }
.divider { display: block; width: 150px; height: 40px; margin: 0 auto 18px; overflow: visible; }
.divider .stem { fill: none; stroke: var(--sage); stroke-width: 1.1; stroke-linecap: round; stroke-dasharray: 1 2; stroke-dashoffset: 1.01; }
.divider .lf path { fill: rgba(116, 134, 106, .16); stroke: var(--sage); stroke-width: .85; transform: scale(0); }
.divider.in .stem { animation: draw 1.4s var(--ease) forwards; }
.divider.in .lf path { animation: leafIn .6s var(--ease) forwards; animation-delay: calc(.3s + var(--i) * 70ms); }
.rv-on .rv { opacity: 0; transform: translateY(24px); transition: opacity 1s var(--ease), transform 1.1s var(--ease); transition-delay: var(--dl, 0s); }
.rv-on .rv.in { opacity: 1; transform: none; }

/* paper cards */
.card { position: relative; background: var(--paper); border-radius: 4px; padding: 34px 20px 30px; box-shadow: 0 1px 2px rgba(80, 50, 40, .08), 0 22px 40px -26px rgba(80, 50, 40, .45); }
.card::before { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(169, 97, 108, .28); border-radius: 2px; pointer-events: none; }
.month { margin: 0 0 20px; font: italic 400 clamp(28px, 8vw, 34px)/1.1 var(--serif); color: var(--ink); }
.month b { font-weight: 400; color: var(--rose); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 6px; max-width: 320px; margin: 0 auto 24px; }
.cal-wd { padding-bottom: 10px; font: 600 10px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.cal-d { position: relative; height: 40px; display: grid; place-items: center; }
.cal-d b { position: relative; z-index: 1; font: 500 15px/1 var(--sans); color: var(--ink); font-variant-numeric: lining-nums tabular-nums; }
.cal-wd.we, .cal-d.we b { color: var(--rose); }
.cal-d.is-day b { color: var(--wax); font: 500 16px/1 var(--serif); transition: color .25s 1.05s; }
.cal.in .cal-d.is-day b { color: #fff; }
.day-seal { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; opacity: 0; transform: scale(2.4) rotate(-30deg); filter: drop-shadow(0 3px 3px rgba(70, 15, 25, .35)); }
.day-seal svg { width: 100%; height: 100%; display: block; overflow: visible; }
.cal.in .day-seal { animation: stamp .55s .8s cubic-bezier(.3, 1.5, .55, 1) forwards; }
@keyframes stamp { to { opacity: 1; transform: scale(1) rotate(-8deg); } }
.when { margin: 0; font: italic 400 25px/1.25 var(--serif); color: var(--ink); }

.btn-line svg { width: 17px; height: 17px; fill: none; stroke: var(--rose); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* postcard */
.postcard { text-align: left; padding: 26px 24px 30px; transform-origin: 50% 100%; }

.pc-top { position: relative; display: flex; justify-content: space-between; align-items: flex-start; min-height: 96px; margin-bottom: 18px; border-bottom: 1px dashed rgba(169, 97, 108, .35); padding-bottom: 18px; }

.pc-script { margin: 6px 0 0; font: 400 30px/1 var(--script); color: var(--rose); }
.stamp-wrap { position: relative; flex: none; filter: drop-shadow(0 2px 3px rgba(80, 50, 40, .25)); transform: rotate(4deg); }
.stamp {
  width: 70px; height: 84px; padding: 6px; background: #fffaf3;
  -webkit-mask: linear-gradient(#000 0 0) content-box, radial-gradient(circle, transparent 2.6px, #000 3px) -5px -5px / 10px 10px round;
  mask: linear-gradient(#000 0 0) content-box, radial-gradient(circle, transparent 2.6px, #000 3px) -5px -5px / 10px 10px round;
}
.stamp-in { height: 100%; display: grid; place-items: center; align-content: center; gap: 4px; background: linear-gradient(160deg, #f4dcd6, #e8c3bf); border: 1px solid rgba(123, 30, 43, .25); }
.stamp-in svg { width: 26px; height: 24px; fill: var(--wax); }
.stamp-in span { font: 600 8px/1 var(--sans); letter-spacing: .14em; color: var(--wax); }
.postmark { position: absolute; z-index: 2; top: 24px; right: 12px; width: 140px; height: 77px; overflow: visible; opacity: 0; color: var(--ink); pointer-events: none; }
.postmark .pm-c { fill: none; stroke: currentColor; stroke-width: 1.3; }
.postmark text { font: 600 6.8px var(--sans); letter-spacing: 1px; fill: currentColor; }
.postmark .wave { fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; }
.postcard.in .postmark { animation: pmark .5s 1.1s cubic-bezier(.3, 1.6, .5, 1) forwards; }
@keyframes pmark { from { opacity: 0; transform: scale(1.7) rotate(-14deg); } to { opacity: .62; transform: scale(1) rotate(-8deg); } }
.pc-name { margin: 0 0 10px; font: 400 clamp(30px, 8.8vw, 38px)/1.08 var(--serif); color: var(--ink); }
.pc-addr { margin: 0; font: 400 15px/1.65 var(--sans); color: var(--ink-2); }
.pc-time { margin: 14px 0 0; font: 600 11px/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--rose); font-variant-numeric: lining-nums; }
.btn-wax {
  position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 12px;
  width: min(100%, 330px); margin: 30px auto 0; padding: 19px 22px; border-radius: 999px;
  color: #fff7f2; text-decoration: none; font: 600 12px/1.2 var(--sans); letter-spacing: .16em; text-transform: uppercase;
  background: radial-gradient(120% 160% at 30% 20%, #a3394a, #7b1e2b 55%, #5c1320);

  transition: transform .3s var(--ease);
}
.btn-wax:active { transform: scale(.98); }
.btn-wax svg { flex: none; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.btn-wax::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .25), transparent); transform: skewX(-20deg); animation: shine 5s 2s infinite; }
@keyframes shine { 0% { left: -60%; } 28%, 100% { left: 130%; } }


/* countdown */
.cd { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 360px; margin: 24px auto 0; }
.tile { position: relative; min-width: 0; padding: 16px 0 14px; background: var(--paper); border-radius: 6px; perspective: 400px; box-shadow: 0 1px 2px rgba(80, 50, 40, .08), 0 14px 24px -18px rgba(80, 50, 40, .45); }
.tile::after { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 1px; background: rgba(169, 97, 108, .12); }
.cd-n { display: block; font: 400 clamp(30px, 9vw, 40px)/1 var(--serif); color: var(--ink); font-variant-numeric: lining-nums tabular-nums; }
.cd-n.tick { animation: flip .6s var(--ease); }
@keyframes flip { from { transform: rotateX(-95deg); opacity: .2; } to { transform: none; opacity: 1; } }
.cd-l { display: block; margin-top: 10px; font: 600 9.5px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--rose); }

/* finale */

.sign-l { margin: 0 0 4px; padding-left: .3em; font: 600 10.5px/1 var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--ink-2); }
.sign { display: inline-block; margin: 0; padding: 0 .2em; font: 400 clamp(40px, 12vw, 50px)/1.3 var(--script); color: var(--wax); clip-path: inset(-30% 104% -30% -6%); }
.sign-wrap { margin: 0; }
.sign i { font: italic 400 .6em/1 var(--serif); color: var(--rose); padding: 0 .06em; vertical-align: .1em; }
.sign-wrap.in .sign { animation: write 2.2s .3s cubic-bezier(.55, .1, .35, 1) forwards; }
.reduce .sign, .reduce .nm { clip-path: none; }
.foot { margin: 0; padding-block: 26px 30px; text-align: center; font: 600 10.5px/1 var(--sans); letter-spacing: .32em; text-transform: uppercase; color: var(--ink-2); border-top: 1px solid rgba(169, 97, 108, .2); }

@keyframes fadeIn { to { opacity: 1; } }

@keyframes pulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.5); opacity: 0; } }
@keyframes blink { 50% { opacity: .25; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes draw { to { stroke-dashoffset: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .01ms !important; }

}

      venueAddr: 'Ташкент, Юнусабадский район,<br>махаллинский сход граждан Атчапар-2',
      venueTime: 'Начало в 18:00',
      mapBtn: 'Открыть в Яндекс Картах',
      mapAria: 'Открыть «Золотая Долина» в Яндекс Картах',
      cdTitle: 'До нашей свадьбы осталось',
      cdDone: 'Этот день настал!',
      cdLabels: ['дней', 'часов', 'минут', 'секунд'],
      finale: 'Ждём вас с нетерпением!',
      sign: 'С любовью',
      footer: '14.11.2026 · Ташкент',
      gcalTitle: 'Свадьба Ёркинжона и Севары',
      gcalLoc: 'Золотая Долина, Ташкент, Юнусабадский район, Атчапар-2',
      gcalDetails: 'Начало в 18:00. Карта: '
    }
  };

  var RU_UNITS = [['день', 'дня', 'дней'], ['час', 'часа', 'часов'], ['минута', 'минуты', 'минут'], ['секунда', 'секунды', 'секунд']];

  var W = window.W = {
    reduce: reduce,
    mapUrl: MAP_URL,
    lang: 'uz',
    opened: false,
    userPaused: false,
    opts: {}
  };

  function $(s, c) { return (c || document).querySelector(s); }
  function $$(s, c) { return Array.prototype.slice.call((c || document).querySelectorAll(s)); }
  W.$ = $; W.$$ = $$;

  W.t = function (k) {
    var d = TEXT[W.lang];
    if (d && d[k] != null) return d[k];
    return TEXT.uz[k] != null ? TEXT.uz[k] : '';
  };

  /* ---------- letters ---------- */
  function splitLetters(el) {
    var txt = el.textContent;
    el.textContent = '';
    var sr = document.createElement('span');
    sr.className = 'sr';
    sr.textContent = txt;
    el.appendChild(sr);
    for (var i = 0; i < txt.length; i++) {
      var s = document.createElement('span');
      s.className = 'ch';
      s.setAttribute('aria-hidden', 'true');
      s.style.setProperty('--i', i);
      s.textContent = txt.charAt(i) === ' ' ? ' ' : txt.charAt(i);
      el.appendChild(s);
    }
  }

  /* ---------- language ---------- */
  W.setLang = function (l) {
    if (!TEXT[l]) l = 'uz';
    W.lang = l;
    root.lang = l;
    $$('[data-t]').forEach(function (el) {
      el.innerHTML = W.t(el.getAttribute('data-t'));
      if (el.hasAttribute('data-letters')) splitLetters(el);
    });
    $$('[data-t-aria]').forEach(function (el) {
      el.setAttribute('aria-label', W.t(el.getAttribute('data-t-aria')));
    });
    $$('[data-lang]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === l));
    });
    buildCalendar();
    renderCountdown(true);
    $$('[data-href="gcal"]').forEach(function (a) { a.href = gcalUrl(); });
    try { localStorage.setItem('ys-lang', l); } catch (e) { /* storage unavailable */ }
    if (W.opts.onLang) W.opts.onLang(l);
  };

  /* ---------- calendar (November 2026, Monday first) ---------- */
  function buildCalendar() {
    $$('[data-cal]').forEach(function (el) {
      var wd = W.t('wd');
      var html = '';
      for (var i = 0; i < 7; i++) {
        html += '<span class="cal-wd' + (i >= 5 ? ' we' : '') + '">' + wd[i] + '</span>';
      }
      var off = (new Date(2026, 10, 1).getDay() + 6) % 7;
      for (var j = 0; j < off; j++) html += '<span class="cal-d is-empty" aria-hidden="true"></span>';
      for (var d = 1; d <= 30; d++) {
        var col = (off + d - 1) % 7;
        var day = d === 14;
        html += '<span class="cal-d' + (col >= 5 ? ' we' : '') + (day ? ' is-day' : '') + '"' +
          (day ? ' style="--col:' + col + '"' : '') + '><b>' + d + '</b>' +
          (day ? (W.opts.calMark || '') : '') + '</span>';
      }
      el.innerHTML = html;
    });
  }

  /* ---------- countdown ---------- */
  function ruPlural(n, f) {
    var a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return f[0];
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return f[1];
    return f[2];
  }
  function setUnit(key, str, label, force) {
    $$('[data-cd="' + key + '"]').forEach(function (el) {
      if (el.textContent !== str) {
        el.textContent = str;
        if (!force) {
          el.classList.remove('tick');
          void el.offsetWidth;
          el.classList.add('tick');
        }
      }
    });
    $$('[data-cdl="' + key + '"]').forEach(function (el) {
      if (el.textContent !== label) el.textContent = label;
    });
  }
  function renderCountdown(force) {
    var diff = Math.max(0, EVENT_TS - Date.now());
    var v = [Math.floor(diff / 864e5), Math.floor(diff / 36e5) % 24, Math.floor(diff / 6e4) % 60, Math.floor(diff / 1e3) % 60];
    var keys = ['d', 'h', 'm', 's'];
    var labels = W.t('cdLabels');
    for (var i = 0; i < 4; i++) {
      var str = i === 0 ? String(v[i]) : (v[i] < 10 ? '0' : '') + v[i];
      var label = W.lang === 'ru' ? ruPlural(v[i], RU_UNITS[i]) : labels[i];
      setUnit(keys[i], str, label, force === true);
    }
    $$('[data-cd-title]').forEach(function (el) {
      var txt = diff > 0 ? W.t('cdTitle') : W.t('cdDone');
      if (el.innerHTML !== txt) el.innerHTML = txt;
    });
  }

  function gcalUrl() {
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
      '&text=' + encodeURIComponent(W.t('gcalTitle')) +
      '&dates=20261114T130000Z/20261114T180000Z' +
      '&location=' + encodeURIComponent(W.t('gcalLoc')) +
      '&details=' + encodeURIComponent(W.t('gcalDetails') + MAP_URL);
  }

  /* ---------- music ---------- */
  var audio = null, fadeRaf = 0, fadeTimer = 0, resumeOnShow = false;
  function setMusicUI(on) {
    root.classList.toggle('music-on', on);
    $$('[data-music]').forEach(function (b) { b.setAttribute('aria-pressed', String(on)); });
  }
  function fadeTo(target, ms, cb) {
    cancelAnimationFrame(fadeRaf);
    clearTimeout(fadeTimer);
    var from = audio.volume, t0 = performance.now(), finished = false;
    function end() {
      if (finished) return;
      finished = true;
      try { audio.volume = target; } catch (e) { /* iOS keeps volume fixed */ }
      if (cb) cb();
    }
    function step(t) {
      var k = Math.min(1, (t - t0) / ms);
      try { audio.volume = from + (target - from) * k; } catch (e) { /* iOS */ }
      if (k < 1) fadeRaf = requestAnimationFrame(step); else end();
    }
    fadeRaf = requestAnimationFrame(step);
    fadeTimer = setTimeout(end, ms + 250);
  }
  W.play = function () {
    if (!audio) return;
    try { audio.volume = 0; } catch (e) { /* iOS */ }
    setMusicUI(true);
    var p = audio.play();
    if (p && p.then) {
      p.then(function () { fadeTo(0.8, 2600); }).catch(function () { setMusicUI(false); });
    } else {
      fadeTo(0.8, 2600);
    }
  };
  W.pause = function () {
    if (!audio) return;
    setMusicUI(false);
    if (document.hidden) { audio.pause(); return; }
    fadeTo(0, 380, function () { audio.pause(); });
  };
  function toggleMusic() {
    if (root.classList.contains('music-on')) { W.userPaused = true; W.pause(); }
    else { W.userPaused = false; W.play(); }
  }
  document.addEventListener('visibilitychange', function () {
    if (!audio) return;
    if (document.hidden) {
      if (!audio.paused) { resumeOnShow = true; audio.pause(); }
    } else if (resumeOnShow) {
      resumeOnShow = false;
      if (!W.userPaused && root.classList.contains('music-on')) {
        var p = audio.play();
        if (p && p.catch) p.catch(function () { setMusicUI(false); });
      }
    }
  });

  /* ---------- reveal on scroll ---------- */
  function startReveal() {
    var els = $$('.rv');
    if (!('IntersectionObserver' in window) || reduce) {
      els.forEach(function (e) { e.classList.add('in'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
      });
    }, { threshold: 0.14, rootMargin: '0px 0px -6% 0px' });
    els.forEach(function (e) { io.observe(e); });
  }

  /* ---------- scroll hooks ---------- */
  var scrollFns = [], ticking = false;
  W.onScroll = function (fn) { scrollFns.push(fn); };
  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      var y = window.pageYOffset || document.documentElement.scrollTop;
      for (var i = 0; i < scrollFns.length; i++) scrollFns[i](y);
    });
  }, { passive: true });

  /* ---------- canvas loop helper (pauses off-screen) ---------- */
  W.canvas = function (canvas, api) {
    var ctx = canvas.getContext('2d');
    var w = 0, h = 0, raf = 0, running = false, ready = false;
    function resize() {
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      var r = canvas.getBoundingClientRect();
      if (!r.width || !r.height) return;
      var first = !ready || Math.abs(r.width - w) > 40;
      w = r.width; h = r.height;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (first && api.setup) api.setup(w, h);
      ready = true;
      if (reduce) api.draw(ctx, w, h, 0);
    }
    function frame(t) {
      if (!running) return;
      api.draw(ctx, w, h, t);
      raf = requestAnimationFrame(frame);
    }
    function start() {
      if (running || reduce) return;
      if (!ready) resize();
      running = true;
      raf = requestAnimationFrame(frame);
    }
    function stop() { running = false; cancelAnimationFrame(raf); }
    resize();
    window.addEventListener('resize', resize);
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (e) {
        if (e[0].isIntersecting) start(); else stop();
      }).observe(canvas);
    } else start();
    return { start: start, stop: stop, resize: resize };
  };

  /* ---------- open sequence ---------- */
  W.heroGo = function () { root.classList.add('hero-go'); };
  W.open = function () {
    if (W.opened) return;
    W.opened = true;
    if (!W.userPaused) W.play();
    root.classList.add('is-opening');
    var finished = false;
    function finish() {
      if (finished) return;
      finished = true;
      root.classList.remove('is-locked', 'is-opening');
      root.classList.add('is-open', 'hero-go');
      var g = $('#gate');
      if (g) g.hidden = true;
      startReveal();
      if (W.opts.onOpened) W.opts.onOpened();
    }
    if (W.opts.onOpen) W.opts.onOpen(finish); else finish();
    setTimeout(finish, 6000);
  };

  W.init = function (opts) {
    W.opts = opts || {};
    var extra = W.opts.text || {};
    ['uz', 'ru'].forEach(function (l) {
      var src = extra[l] || {};
      for (var k in src) if (Object.prototype.hasOwnProperty.call(src, k)) TEXT[l][k] = src[k];
    });
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
    root.classList.add('is-locked');
    if (reduce) root.classList.add('reduce');
    else if ('IntersectionObserver' in window) root.classList.add('rv-on');

    audio = $('#bgm');
    $$('[data-music]').forEach(function (b) { b.addEventListener('click', toggleMusic); });
    $$('[data-lang]').forEach(function (b) {
      b.addEventListener('click', function () { W.setLang(b.getAttribute('data-lang')); });
    });
    $$('[data-href="map"]').forEach(function (a) {
      a.href = MAP_URL; a.target = '_blank'; a.rel = 'noopener';
    });
    $$('[data-href="gcal"]').forEach(function (a) { a.target = '_blank'; a.rel = 'noopener'; });

    var l = 'uz';
    try {
      var saved = localStorage.getItem('ys-lang');
      if (saved && TEXT[saved]) l = saved;
    } catch (e) { /* storage unavailable */ }
    W.setLang(l);
    renderCountdown(true);
    setInterval(renderCountdown, 1000);

    $$('[data-open]').forEach(function (b) { b.addEventListener('click', W.open); });
    requestAnimationFrame(function () { root.classList.add('is-ready'); });
  };
})();

</script>
<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function f(n) { return Math.round(n * 10) / 10; }
  function leaf(parent, x, y, ang, len, wid, i) {
    var g = el('g', { 'class': 'lf', transform: 'translate(' + f(x) + ' ' + f(y) + ') rotate(' + f(ang) + ')', style: '--i:' + i }, parent);
    el('path', { d: 'M0 0C' + f(len * 0.28) + ' ' + f(-wid) + ' ' + f(len * 0.72) + ' ' + f(-wid) + ' ' + f(len) + ' 0C' + f(len * 0.72) + ' ' + f(wid) + ' ' + f(len * 0.28) + ' ' + f(wid) + ' 0 0Z' }, g);
  }

  /* leaf wreath: two branches meeting at the bottom, open at the top */
  function wreath(svg) {
    var cx = 150, cy = 150, R = 122, idx = 0;
    function branch(a0, a1, n) {
      var dir = a1 > a0 ? 1 : -1;
      var large = Math.abs(a1 - a0) > 180 ? 1 : 0;
      var p0 = [cx + R * Math.cos(a0 * Math.PI / 180), cy + R * Math.sin(a0 * Math.PI / 180)];
      var p1 = [cx + R * Math.cos(a1 * Math.PI / 180), cy + R * Math.sin(a1 * Math.PI / 180)];
      el('path', { 'class': 'stem', pathLength: 1, d: 'M' + f(p0[0]) + ' ' + f(p0[1]) + 'A' + R + ' ' + R + ' 0 ' + large + ' ' + (dir > 0 ? 1 : 0) + ' ' + f(p1[0]) + ' ' + f(p1[1]) }, svg);
      for (var k = 0; k < n; k++) {
        var t = (k + 0.6) / n;
        var a = a0 + (a1 - a0) * t;
        var rad = a * Math.PI / 180;
        var x = cx + R * Math.cos(rad), y = cy + R * Math.sin(rad);
        var tang = a + 90 * dir;
        var size = 19 - t * 8;
        leaf(svg, x, y, tang - 38 * dir, size, size * 0.3, idx);
        leaf(svg, x, y, tang + 34 * dir, size * 0.92, size * 0.28, idx + 1);
        if (k % 3 === 1) {
          var bx = x + Math.cos(rad) * 7, by = y + Math.sin(rad) * 7;
          var g = el('g', { 'class': 'berry', transform: 'translate(' + f(bx) + ' ' + f(by) + ')', style: '--i:' + (idx + 2) }, svg);
          el('circle', { r: 2.6 }, g);
        }
        idx += 2;
      }
    }
    branch(98, 252, 13);
    idx = 0;
    branch(82, -72, 13);
  }

  /* eucalyptus sprig for corners and dividers */
  function sprig(svg, p0, p1, p2, n, size, round) {
    el('path', { 'class': 'stem', pathLength: 1, d: 'M' + p0.join(' ') + 'Q' + p1.join(' ') + ' ' + p2.join(' ') }, svg);
    for (var k = 0; k < n; k++) {
      var t = 0.1 + 0.86 * k / (n - 1);
      var u = 1 - t;
      var x = u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0];
      var y = u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1];
      var tx = 2 * u * (p1[0] - p0[0]) + 2 * t * (p2[0] - p1[0]);
      var ty = 2 * u * (p1[1] - p0[1]) + 2 * t * (p2[1] - p1[1]);
      var ang = Math.atan2(ty, tx) * 180 / Math.PI;
      var side = k % 2 ? 1 : -1;
      var s = size * (1 - t * 0.4);
      leaf(svg, x, y, ang + side * 52, s, s * (round ? 0.42 : 0.3), k);
    }
  }

  W.$$('[data-sprig]').forEach(function (svg) {
    sprig(svg, [6, 20], [80, 30], [200, 120], 11, 26, true);
    sprig(svg, [6, 20], [30, 90], [70, 190], 8, 22, true);
  });
  W.$$('[data-divider]').forEach(function (svg) {
    sprig(svg, [75, 22], [40, 14], [4, 26], 5, 13, false);
    sprig(svg, [75, 22], [110, 14], [146, 26], 5, 13, false);
    var g = el('g', { 'class': 'berry' }, svg);
    el('circle', { cx: 75, cy: 22, r: 3, fill: '#a9616c' }, g);
  });
  wreath(W.$('#wreath'));

  /* falling petals */
  W.$$('[data-petals]').forEach(function (box) {
    if (W.reduce) return;
    var n = +box.getAttribute('data-petals');
    for (var i = 0; i < n; i++) {
      var p = document.createElement('span');
      p.className = 'petal';
      var dur = 9 + Math.random() * 8;
      p.style.cssText = '--x:' + (Math.random() * 100).toFixed(1) + '%;--dur:' + dur.toFixed(1) + 's;--delay:' + (-Math.random() * dur).toFixed(1) + 's;--sw:' + (2.4 + Math.random() * 2).toFixed(1) + 's;--fl:' + (2 + Math.random() * 3).toFixed(1) + 's;--s:' + (9 + Math.random() * 9).toFixed(1) + 'px';
      p.innerHTML = '<b><i></i></b>';
      box.appendChild(p);
    }
  });

  W.init({
    text: {
      uz: {
        gateKicker: 'Sizga maktub keldi',
        gateTo: 'Aziz mehmonimizga',
        gateHint: 'Muhrni bosing',
        openAria: 'Muhrni ochish va taklifnomani o‘qish',
        heroDate: '14-noyabr, 2026',
        heroDay: 'Shanba · soat 18:00',
        pcScript: 'Sizni kutamiz',
        postmark: 'TOSHKENT • 14.11.2026 • TOSHKENT'
      },
      ru: {
        gateKicker: 'Вам письмо',
        gateTo: 'Дорогому гостю',
        gateHint: 'Нажмите на печать',
        openAria: 'Открыть печать и прочитать приглашение',
        heroDate: '14 ноября 2026',
        heroDay: 'Суббота · 18:00',
        pcScript: 'Ждём вас',
        postmark: 'ТАШКЕНТ • 14.11.2026 • ТАШКЕНТ'
      }
    },
    calMark: '<span class="day-seal" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#waxBlob"/></svg></span>',
    onOpen: function (done) {
      var gate = W.$('#gate'), env = W.$('#env'), letter = W.$('#letter'), flood = W.$('#flood');
      if (W.reduce) {
        W.heroGo();
        gate.classList.add('fade-out');
        setTimeout(done, 700);
        return;
      }
      gate.classList.add('s1');
      setTimeout(function () { env.classList.add('flap-under'); }, 600);
      setTimeout(function () { gate.classList.add('s2'); }, 900);
      setTimeout(function () {
        var r = letter.getBoundingClientRect();
        gate.classList.add('s3');
        flood.style.left = r.left + 'px';
        flood.style.top = r.top + 'px';
        flood.style.width = r.width + 'px';
        flood.style.height = r.height + 'px';
        flood.hidden = false;
        void flood.offsetWidth;
        flood.classList.add('grow');
        setTimeout(function () {
          W.heroGo();
          done();
          flood.classList.add('fade');
          setTimeout(function () { flood.hidden = true; }, 900);
        }, 950);
      }, 1750);
    }
  });

  if (!W.reduce) {
    var hero = W.$('#top'), heroIn = W.$('#heroIn');
    W.onScroll(function (y) {
      var h = hero.offsetHeight || 1;
      var k = Math.min(1, y / (h * 0.8));
      heroIn.style.opacity = String(1 - k * 0.9);
      heroIn.style.transform = 'translate3d(0,' + (y * 0.25).toFixed(1) + 'px,0)';
    });
  }
})();
