<style>
:root {
  /* Layout: lapis night with gold girih. Carved double doors in a pointed-arch portal open onto a starry hero; ivory tile panels with turquoise borders for text. */
  --night: #0b1838;
  --lapis: #163a7a;
  --lapis-2: #1f4f9e;
  --turq: #3fb3ac;
  --gold: #d4a64c;
  --gold-hi: #f3d995;
  --gold-dk: #a87a2a;
  --ivory: #f7f1e4;
  --ink: #13224a;
  --ink-2: #4b5676;
  --display: "Forum", "Cormorant SC", Georgia, "Times New Roman", serif;
  --sans: "Manrope", "Segoe UI", Roboto, Arial, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --girih: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><g fill='none' stroke='%23d4a64c' stroke-width='1'><path d='M40 22L52.7 27.3L58 40L52.7 52.7L40 58L27.3 52.7L22 40L27.3 27.3Z' stroke-opacity='.5'/><path d='M27.3 27.3H52.7V52.7H27.3ZM40 22L58 40L40 58L22 40Z'/><path d='M0 0L14 14M80 0L66 14M0 80L14 66M80 80L66 66M40 0V22M40 58V80M0 40H22M58 40H80'/></g></svg>");
  --band: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 18 18'><g fill='%23d4a64c'><circle cx='3' cy='3' r='1.5'/><circle cx='15' cy='3' r='1.5'/><circle cx='3' cy='15' r='1.5'/><circle cx='15' cy='15' r='1.5'/></g><g fill='%233fb3ac'><path d='M9 .9L11.1 3L9 5.1L6.9 3Z'/><path d='M3 6.9L5.1 9L3 11.1L.9 9Z'/><path d='M15 6.9L17.1 9L15 11.1L12.9 9Z'/><path d='M9 12.9L11.1 15L9 17.1L6.9 15Z'/></g></svg>");
  --cap: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 56' preserveAspectRatio='none'><path fill='%23f7f1e4' d='M0 56V42C0 30 30 13 50 0C70 13 100 30 100 42V56Z'/><path fill='none' stroke='%23d4a64c' stroke-width='1' vector-effect='non-scaling-stroke' d='M3.5 56V43C3.5 32 32 17 50 6C68 17 96.5 32 96.5 43V56'/></svg>");
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html.is-locked, html.is-locked body { overflow: hidden; }
body { margin: 0; background: var(--night); color: var(--ivory); font-family: var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body:has(#gate:not([hidden])) { overflow: hidden; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }

/* ---------- floating controls ---------- */
.hud { position: fixed; z-index: 80; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
.hud > * { pointer-events: auto; }
.tile-chip { background: rgba(11, 24, 56, .62); border: 1px solid rgba(212, 166, 76, .55); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.btn-music { width: 44px; height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; color: var(--gold-hi); cursor: pointer; }
.btn-music svg { grid-area: 1 / 1; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: opacity .3s, transform .3s; }
.eq { grid-area: 1 / 1; display: flex; align-items: flex-end; gap: 3px; height: 16px; opacity: 0; transition: opacity .3s; }
.eq i { width: 2.5px; height: 100%; border-radius: 2px; background: var(--gold-hi); transform-origin: bottom; transform: scaleY(.25); }
.music-on .btn-music svg { opacity: 0; transform: scale(.6); }
.music-on .eq { opacity: 1; }
.music-on .eq i { animation: eq 1s ease-in-out infinite; }
.music-on .eq i:nth-child(2) { animation-duration: .8s; animation-delay: -.3s; }
.music-on .eq i:nth-child(3) { animation-duration: 1.15s; animation-delay: -.6s; }
.music-on .eq i:nth-child(4) { animation-duration: .9s; animation-delay: -.15s; }
@keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
.lang { display: flex; padding: 3px; border-radius: 999px; }
.lang button { border: 0; background: transparent; color: var(--gold-hi); cursor: pointer; font: 600 11px/1 var(--sans); letter-spacing: .14em; padding: 12px 12px 12px 13px; min-width: 44px; border-radius: 999px; transition: background .3s, color .3s; }
.lang button[aria-pressed="true"] { background: var(--gold); color: var(--night); }

/* ---------- shared night backdrop ---------- */
.night { position: relative; background: radial-gradient(90% 60% at 50% 40%, #1a3f86 0%, #102a61 45%, var(--night) 100%); }
.night::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: var(--girih); background-size: 80px 80px; opacity: .07; }
.fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }

/* ---------- gate: portal with carved doors ---------- */
.gate { position: fixed; inset: 0; z-index: 50; overflow: hidden; touch-action: none; display: grid; place-items: center; padding-block: calc(env(safe-area-inset-top, 0px) + 72px) calc(env(safe-area-inset-bottom, 0px) + 28px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transition: opacity .7s ease; }
.gate-in { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; text-align: center; }
.portal {
  position: relative;
  width: min(80vw, 330px);
  width: min(80vw, 330px, calc((100svh - 250px) * .6667));
  aspect-ratio: 2 / 3;
  transform-origin: 50% 62%;
  opacity: 0; animation: portalIn 1.4s .15s var(--ease) forwards;
  filter: drop-shadow(0 30px 40px rgba(0, 0, 0, .45));
}
@keyframes portalIn { from { opacity: 0; transform: scale(.94) translateY(20px); } to { opacity: 1; transform: none; } }
.doors { position: absolute; left: 11%; width: 78%; top: 15.333%; height: 84.667%; clip-path: url(#archClip); perspective: 900px; }
.portal-light { position: absolute; inset: 0; background: radial-gradient(60% 45% at 50% 58%, #fff6dc 0%, #f3d995 22%, #c99439 42%, #1f4f9e 78%, #10295f 100%); opacity: .55; transition: opacity 1.4s ease, transform 2.2s ease; }
.door { position: absolute; top: 0; bottom: 0; width: 50%; transition: transform 1.55s cubic-bezier(.55, .05, .25, 1); }
.door.l { left: 0; transform-origin: 0 50%; }
.door.r { right: 0; transform-origin: 100% 50%; }
.door svg { display: block; width: 100%; height: 100%; }
.door.r svg { transform: scaleX(-1); }
.door::after { content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease; background: linear-gradient(90deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, .55)); }
.door.r::after { background: linear-gradient(-90deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, .55)); }
.portal-frame { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.portal-frame .gl { fill: none; stroke: var(--gold); stroke-width: 1; }
.portal-frame .thin { stroke-opacity: .55; stroke-width: .7; }
.portal-frame .arch-o, .portal-frame .arch-i { fill: none; stroke: var(--gold-hi); stroke-dasharray: 1 2; stroke-dashoffset: 1.01; animation: draw 2.4s .6s var(--ease) forwards; }
.portal-frame .arch-o { stroke-width: .8; stroke-opacity: .7; }
.portal-frame .arch-i { stroke-width: 1.4; animation-delay: .8s; }
.portal-frame .sp { fill: var(--turq); stroke: var(--gold-hi); stroke-width: .7; }
.portal-title { position: absolute; left: 0; right: 0; top: 0; height: 11.33%; display: grid; place-items: center; margin: 0; padding: 0 10%; font: 400 clamp(11.5px, 3.8vw, 15px)/1.15 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--gold-hi); text-wrap: balance; }
.medallion { position: absolute; z-index: 3; left: 50%; top: 62%; width: 92px; height: 92px; margin: -46px 0 0 -46px; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 50%; transition: transform .45s var(--ease), opacity .45s ease, filter .45s; opacity: 0; animation: popIn .9s 1.3s var(--ease) forwards; }
.medallion svg { width: 100%; height: 100%; display: block; overflow: visible; }
.med-ring { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
.medallion::before { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1px solid var(--gold-hi); opacity: 0; animation: pulse 2.6s 2.4s var(--ease) infinite; }
.medallion:hover { filter: drop-shadow(0 0 10px rgba(243, 217, 149, .6)); }
.gate-hint { margin: 24px 0 0; display: inline-flex; align-items: center; gap: 10px; font: 600 11px/1 var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--gold-hi); opacity: 0; animation: fadeIn 1s 2s forwards; }
.gate-hint::before, .gate-hint::after { content: ""; width: 18px; height: 1px; background: var(--gold); }
.gate-names { margin: 14px 0 0; font: 400 19px/1 var(--display); letter-spacing: .06em; color: var(--ivory); opacity: 0; animation: fadeIn 1.2s 2.3s forwards; }
.gate-names i { font-style: normal; color: var(--gold); padding: 0 .25em; }
/* open sequence */
.s1 .medallion { animation: none; opacity: 0; transform: rotate(45deg) scale(1.5); filter: drop-shadow(0 0 18px rgba(243, 217, 149, .9)); }
.s1 .medallion::before { animation: none; }
.s1 .door.l { transform: rotateY(80deg); }
.s1 .door.r { transform: rotateY(-80deg); }
.s1 .door::after { opacity: 1; }
.s1 .portal-light { opacity: 1; transform: scale(1.15); }
.s1 .gate-hint { animation: fadeIn 1s 2s forwards, fadeOut .4s forwards; }
.s1 .gate-names { animation: fadeIn 1.2s 2.3s forwards, fadeOut .4s forwards; }
.s2 .portal { animation: portalIn 1.4s .15s var(--ease) forwards, zoomIn 1.35s cubic-bezier(.7, 0, .3, 1) forwards; }
@keyframes zoomIn { from { transform: none; } to { transform: scale(4.2); } }
.s3.gate { opacity: 0; }
.gate.fade-out { opacity: 0; }

/* ---------- hero ---------- */
.hero { overflow: hidden; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center; padding-block: 78px 110px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hero.night { background: radial-gradient(70% 45% at 50% 46%, rgba(243, 217, 149, .22) 0%, rgba(201, 148, 57, .08) 40%, transparent 70%), radial-gradient(90% 60% at 50% 40%, #1a3f86 0%, #102a61 45%, var(--night) 100%); }
.rosette { position: absolute; left: 50%; top: 46%; width: min(150vw, 660px); height: auto; aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none; overflow: visible; }
.rosette g { transform-box: view-box; transform-origin: 200px 200px; }
.hero-go .rosette g { animation: spin 140s linear infinite; }
.rosette path { fill: none; stroke: var(--gold); stroke-width: .8; stroke-opacity: .26; stroke-dasharray: 1 2; stroke-dashoffset: 1.01; }
.hero-go .rosette path { animation: draw 3.2s var(--ease) forwards; animation-delay: calc(.2s + var(--i, 0) * .18s); }
.hero-in { position: relative; z-index: 1; width: min(100%, 330px); width: min(100%, 330px, calc((100svh - 220px) * .652)); aspect-ratio: 300 / 460; container-type: inline-size; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 18%; will-change: transform, opacity; }
.h-arch { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; -webkit-mask-image: linear-gradient(#000 70%, transparent 98%); mask-image: linear-gradient(#000 70%, transparent 98%); }
.h-arch path { fill: none; stroke: var(--gold); stroke-dasharray: 1 2; stroke-dashoffset: 1.01; }
.h-arch path + path { stroke-opacity: .5; }
.h-arch .star { fill: var(--gold-hi); stroke: none; stroke-dasharray: none; transform-box: fill-box; transform-origin: center; transform: scale(0); }
.hero-go .h-arch path { animation: draw 2.6s .3s var(--ease) forwards; }
.hero-go .h-arch path + path { animation-delay: .55s; }
.hero-go .h-arch .star { animation: popIn .8s 2s var(--ease) forwards, twinkle 3.4s 3s ease-in-out infinite; }
.h-eyebrow { margin: 0 0 20px; padding-left: .3em; font: 600 10.5px/1.4 var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--gold-hi); opacity: 0; }
.hero-go .h-eyebrow { animation: fadeIn 1.2s .5s forwards; }
.names { margin: 0; display: flex; flex-direction: column; align-items: center; font-weight: 400; }
.gold-text { background: linear-gradient(100deg, #b98a32 0%, #f6dc95 22%, #c9973c 42%, #fff0c4 56%, #c08c34 74%, #f3d27e 100%); background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.nm { display: block; white-space: nowrap; padding: 0 .1em; font: 400 clamp(42px, 13.5vw, 54px)/1.08 var(--display); font-size: 16.5cqi; letter-spacing: .02em; opacity: 0; }
.hero-go .nm { animation: nmIn 1.7s var(--ease) forwards, shimmer 7s linear infinite; animation-delay: .7s, 0s; }
.hero-go .nm-2 { animation-delay: 1.25s, 0s; }
@keyframes nmIn { from { opacity: 0; letter-spacing: .45em; filter: blur(8px); } to { opacity: 1; letter-spacing: .02em; filter: blur(0); } }
@keyframes shimmer { from { background-position: 0% 0; } to { background-position: -260% 0; } }
.orn { display: block; width: 150px; height: 18px; margin: 10px 0; overflow: visible; opacity: 0; }
.orn path { fill: none; stroke: var(--gold); stroke-width: 1; }
.orn .s8 { fill: var(--gold-hi); stroke: none; }
.hero-go .orn { animation: popIn .9s 1.1s var(--ease) forwards; }
.h-date { margin: 26px 0 6px; font: 400 22px/1 var(--display); letter-spacing: .22em; color: var(--ivory); opacity: 0; }
.h-day { margin: 0; padding-left: .26em; font: 600 10.5px/1 var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--turq); opacity: 0; }
.hero-go .h-date { animation: fadeUp 1s 2.2s var(--ease) forwards; }
.hero-go .h-day { animation: fadeUp 1s 2.4s var(--ease) forwards; }
.cue { position: absolute; z-index: 1; left: 50%; bottom: 36px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; color: rgba(247, 241, 228, .75); text-decoration: none; font: 600 10px/1 var(--sans); letter-spacing: .3em; text-transform: uppercase; padding-left: .3em; opacity: 0; }
.hero-go .cue { animation: fadeIn 1s 2.9s forwards; }
.cue i { position: relative; width: 1px; height: 40px; overflow: hidden; background: rgba(212, 166, 76, .35); }
.cue i::after { content: ""; position: absolute; left: -1px; top: -12px; width: 3px; height: 12px; border-radius: 2px; background: var(--gold-hi); animation: drip 2.2s var(--ease) infinite; }
@keyframes drip { to { top: 42px; } }

/* ---------- sections ---------- */
#site { position: relative; background: linear-gradient(180deg, #0f275a 0%, #0b1838 16%, #112b63 48%, #0b1838 80%, #0f275a 100%); }
#site::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: var(--girih); background-size: 80px 80px; opacity: .06; }
.hero { z-index: 1; }
.sec { position: relative; padding-block: 70px; }
.wrap { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; text-align: center; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.eyebrow { margin: 0 0 12px; padding-left: .3em; font: 600 10.5px/1.3 var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--gold-hi); }
.h { margin: 0 0 18px; font: 400 clamp(30px, 8.8vw, 38px)/1.12 var(--display); color: var(--ivory); text-wrap: balance; }
.rv-on .rv { opacity: 0; transform: translateY(26px); transition: opacity 1s var(--ease), transform 1.1s var(--ease); transition-delay: var(--dl, 0s); }
.rv-on .rv.in { opacity: 1; transform: none; }
.panel { position: relative; margin-top: 56px; padding: 30px 26px 34px; background: var(--ivory); color: var(--ink); border-radius: 0 0 6px 6px; box-shadow: 0 34px 60px -34px rgba(0, 0, 0, .7); }
.panel::before { content: ""; position: absolute; left: 0; right: 0; top: -55px; height: 56px; background: var(--cap) no-repeat 0 0 / 100% 100%; }
.panel::after { content: ""; position: absolute; left: 9px; right: 9px; bottom: 9px; top: 0; border: 6px solid transparent; border-top: 0; border-image: var(--band) 6 round; pointer-events: none; }
.panel .eyebrow { color: var(--gold-dk); }
.panel .h { color: var(--ink); }
.panel-star { display: block; width: 30px; height: 30px; margin: -8px auto 14px; }
.lead { max-width: 33ch; margin: 0 auto 14px; font: 400 16px/1.75 var(--sans); color: var(--ink-2); text-wrap: pretty; }
.accent { max-width: 24ch; margin: 24px auto 0; font: 400 22px/1.35 var(--display); color: var(--lapis); text-wrap: balance; }

/* calendar */
.month { margin: 0 0 22px; font: 400 clamp(30px, 8.6vw, 36px)/1.1 var(--display); color: var(--ivory); letter-spacing: .04em; }
.month b { font-weight: 400; color: var(--gold-hi); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 6px; max-width: 340px; margin: 0 auto 28px; }
.cal-wd { padding-bottom: 12px; font: 600 10px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: rgba(247, 241, 228, .6); }
.cal-d { position: relative; height: 42px; display: grid; place-items: center; }
.cal-d b { position: relative; z-index: 1; font: 500 15.5px/1 var(--sans); color: rgba(247, 241, 228, .92); font-variant-numeric: tabular-nums; }
.cal-wd.we, .cal-d.we b { color: var(--turq); }
.cal-d.is-day b { font: 400 18px/1 var(--display); color: var(--gold-hi); transition: color .3s 1.1s; }
.cal.in .cal-d.is-day b { color: var(--night); }
.cal-star { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; transform: rotate(-135deg) scale(0); filter: drop-shadow(0 0 10px rgba(243, 217, 149, .45)); }
.cal.in .cal-star { animation: starIn 1s .7s cubic-bezier(.3, 1.4, .5, 1) forwards; }
@keyframes starIn { to { transform: rotate(0) scale(1); } }
.when { margin: 0; font: 400 25px/1.25 var(--display); color: var(--ivory); letter-spacing: .03em; }
.when-time { margin: 10px 0 26px; padding-left: .26em; font: 600 11px/1 var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--turq); }
.btn-out { display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px; border: 1px solid rgba(212, 166, 76, .6); border-radius: 999px; color: var(--gold-hi); text-decoration: none; font: 600 11px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; transition: background .3s; }
.btn-out:hover { background: rgba(212, 166, 76, .1); }
.btn-out svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* venue */
.lantern { display: block; width: 116px; height: auto; margin: -6px auto 10px; overflow: visible; }
.lantern .ln { fill: none; stroke: var(--lapis); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 2; stroke-dashoffset: 1.01; }
.lantern .lg { fill: none; stroke: var(--gold-dk); stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 2; stroke-dashoffset: 1.01; }
.lantern .glow { opacity: 0; transform-box: fill-box; transform-origin: center; }
.lantern.in .ln, .lantern.in .lg { animation: draw 2.2s var(--ease) forwards; animation-delay: var(--dd, 0s); }
.lantern.in .glow { animation: fadeIn 1.2s 1.6s forwards, breathe 3.6s 2.8s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.88); opacity: .7; } }
.venue-name { margin: 0 0 12px; font: 400 clamp(34px, 10vw, 44px)/1.05 var(--display); color: var(--ink); letter-spacing: .02em; }
.addr { margin: 0; font: 400 15.5px/1.65 var(--sans); color: var(--ink-2); text-wrap: balance; }

.btn-tile {

  width: min(100%, 320px); margin: 0 auto; padding: 19px 22px; border-radius: 14px;
  color: var(--gold-hi); text-decoration: none; font: 600 12px/1.2 var(--sans); letter-spacing: .16em; text-transform: uppercase;
  background: linear-gradient(160deg, #1f4f9e, #143572 60%, #0f2a5e);

  transition: transform .3s var(--ease);
}
.btn-tile:active { transform: scale(.98); }
.btn-tile svg { flex: none; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.btn-tile::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(243, 217, 149, .28), transparent); transform: skewX(-20deg); animation: shine 5s 2s infinite; }

.navi-link { display: inline-flex; align-items: center; gap: 9px; margin-top: 16px; padding: 12px 4px 8px; color: var(--ink-2); text-decoration: none; font: 600 10.5px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; border-bottom: 1px solid rgba(168, 122, 42, .45); transition: color .3s; }
.navi-link:hover { color: var(--lapis); }
.navi-link svg { width: 15px; height: 15px; fill: none; stroke: var(--gold-dk); stroke-width: 1.6; stroke-linejoin: round; }

/* countdown */
.cd { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 360px; margin: 28px auto 0; }
.cd-u { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.cd-star { position: relative; width: 100%; max-width: 80px; aspect-ratio: 1; display: grid; place-items: center; }
.cd-star svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; animation: spin 50s linear infinite; }
.cd-u:nth-child(even) .cd-star svg { animation-direction: reverse; }
.cd-star use { fill: rgba(212, 166, 76, .1); stroke: var(--gold); stroke-width: 1.4; }
.cd-n { position: relative; font: 400 clamp(24px, 7vw, 30px)/1 var(--display); color: var(--ivory); font-variant-numeric: lining-nums tabular-nums; }
.cd-n.tick { animation: tick .6s var(--ease); }
@keyframes tick { from { opacity: 0; transform: translateY(-40%); } to { opacity: 1; transform: none; } }
.cd-l { font: 600 9.5px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--gold-hi); }

/* finale */
.mini-rosette { display: block; width: 120px; height: 120px; margin: 0 auto 22px; overflow: visible; }
.mini-rosette path { fill: none; stroke: var(--gold); stroke-width: 1.3; stroke-dasharray: 1 2; stroke-dashoffset: 1.01; }

.foot { position: relative; margin: 0; padding-block: 24px 28px; text-align: center; font: 600 10.5px/1 var(--sans); letter-spacing: .32em; text-transform: uppercase; color: var(--gold); border-top: 1px solid rgba(212, 166, 76, .22); background: var(--night); }

      venueTime: 'Начало в 18:00',

      mapAria: 'Открыть «Золотая Долина» в Яндекс Картах',
      cdTitle: 'До нашей свадьбы осталось',
      cdDone: 'Этот день настал!',
      cdLabels: ['дней', 'часов', 'минут', 'секунд'],
      finale: 'Ждём вас с нетерпением!',
      sign: 'С любовью',
      footer: '14.11.2026 · Ташкент',
      gcalTitle: 'Свадьба Ёркинжона и Севары',
      gcalLoc: 'Золотая Долина, Ташкент, Юнусабадский район, Атчапар-2',
      gcalDetails: 'Начало в 18:00. Карта: '
    }
  };

  var RU_UNITS = [['день', 'дня', 'дней'], ['час', 'часа', 'часов'], ['минута', 'минуты', 'минут'], ['секунда', 'секунды', 'секунд']];

  var W = window.W = {
    reduce: reduce,
    mapUrl: MAP_URL,
    lang: 'uz',
    opened: false,
    userPaused: false,
    opts: {}
  };

  function $(s, c) { return (c || document).querySelector(s); }
  function $$(s, c) { return Array.prototype.slice.call((c || document).querySelectorAll(s)); }
  W.$ = $; W.$$ = $$;

  W.t = function (k) {
    var d = TEXT[W.lang];
    if (d && d[k] != null) return d[k];
    return TEXT.uz[k] != null ? TEXT.uz[k] : '';
  };

  /* ---------- letters ---------- */
  function splitLetters(el) {
    var txt = el.textContent;
    el.textContent = '';
    var sr = document.createElement('span');
    sr.className = 'sr';
    sr.textContent = txt;
    el.appendChild(sr);
    for (var i = 0; i < txt.length; i++) {
      var s = document.createElement('span');
      s.className = 'ch';
      s.setAttribute('aria-hidden', 'true');
      s.style.setProperty('--i', i);
      s.textContent = txt.charAt(i) === ' ' ? ' ' : txt.charAt(i);
      el.appendChild(s);
    }
  }

  /* ---------- language ---------- */
  W.setLang = function (l) {
    if (!TEXT[l]) l = 'uz';
    W.lang = l;
    root.lang = l;
    $$('[data-t]').forEach(function (el) {
      el.innerHTML = W.t(el.getAttribute('data-t'));
      if (el.hasAttribute('data-letters')) splitLetters(el);
    });
    $$('[data-t-aria]').forEach(function (el) {
      el.setAttribute('aria-label', W.t(el.getAttribute('data-t-aria')));
    });
    $$('[data-lang]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === l));
    });
    buildCalendar();
    renderCountdown(true);
    $$('[data-href="gcal"]').forEach(function (a) { a.href = gcalUrl(); });
    try { localStorage.setItem('ys-lang', l); } catch (e) { /* storage unavailable */ }
    if (W.opts.onLang) W.opts.onLang(l);
  };

  /* ---------- calendar (November 2026, Monday first) ---------- */
  function buildCalendar() {
    $$('[data-cal]').forEach(function (el) {
      var wd = W.t('wd');
      var html = '';
      for (var i = 0; i < 7; i++) {
        html += '<span class="cal-wd' + (i >= 5 ? ' we' : '') + '">' + wd[i] + '</span>';
      }
      var off = (new Date(2026, 10, 1).getDay() + 6) % 7;
      for (var j = 0; j < off; j++) html += '<span class="cal-d is-empty" aria-hidden="true"></span>';
      for (var d = 1; d <= 30; d++) {
        var col = (off + d - 1) % 7;
        var day = d === 14;
        html += '<span class="cal-d' + (col >= 5 ? ' we' : '') + (day ? ' is-day' : '') + '"' +
          (day ? ' style="--col:' + col + '"' : '') + '><b>' + d + '</b>' +
          (day ? (W.opts.calMark || '') : '') + '</span>';
      }
      el.innerHTML = html;
    });
  }

  /* ---------- countdown ---------- */
  function ruPlural(n, f) {
    var a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return f[0];
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return f[1];
    return f[2];
  }
  function setUnit(key, str, label, force) {
    $$('[data-cd="' + key + '"]').forEach(function (el) {
      if (el.textContent !== str) {
        el.textContent = str;
        if (!force) {
          el.classList.remove('tick');
          void el.offsetWidth;
          el.classList.add('tick');
        }
      }
    });
    $$('[data-cdl="' + key + '"]').forEach(function (el) {
      if (el.textContent !== label) el.textContent = label;
    });
  }
  function renderCountdown(force) {
    var diff = Math.max(0, EVENT_TS - Date.now());
    var v = [Math.floor(diff / 864e5), Math.floor(diff / 36e5) % 24, Math.floor(diff / 6e4) % 60, Math.floor(diff / 1e3) % 60];
    var keys = ['d', 'h', 'm', 's'];
    var labels = W.t('cdLabels');
    for (var i = 0; i < 4; i++) {
      var str = i === 0 ? String(v[i]) : (v[i] < 10 ? '0' : '') + v[i];
      var label = W.lang === 'ru' ? ruPlural(v[i], RU_UNITS[i]) : labels[i];
      setUnit(keys[i], str, label, force === true);
    }
    $$('[data-cd-title]').forEach(function (el) {
      var txt = diff > 0 ? W.t('cdTitle') : W.t('cdDone');
      if (el.innerHTML !== txt) el.innerHTML = txt;
    });
  }

  function gcalUrl() {
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
      '&text=' + encodeURIComponent(W.t('gcalTitle')) +
      '&dates=20261114T130000Z/20261114T180000Z' +
      '&location=' + encodeURIComponent(W.t('gcalLoc')) +
      '&details=' + encodeURIComponent(W.t('gcalDetails') + MAP_URL);
  }

  /* ---------- music ---------- */
  var audio = null, fadeRaf = 0, fadeTimer = 0, resumeOnShow = false;
  function setMusicUI(on) {
    root.classList.toggle('music-on', on);
    $$('[data-music]').forEach(function (b) { b.setAttribute('aria-pressed', String(on)); });
  }
  function fadeTo(target, ms, cb) {
    cancelAnimationFrame(fadeRaf);
    clearTimeout(fadeTimer);
    var from = audio.volume, t0 = performance.now(), finished = false;
    function end() {
      if (finished) return;
      finished = true;
      try { audio.volume = target; } catch (e) { /* iOS keeps volume fixed */ }
      if (cb) cb();
    }
    function step(t) {
      var k = Math.min(1, (t - t0) / ms);
      try { audio.volume = from + (target - from) * k; } catch (e) { /* iOS */ }
      if (k < 1) fadeRaf = requestAnimationFrame(step); else end();
    }
    fadeRaf = requestAnimationFrame(step);
    fadeTimer = setTimeout(end, ms + 250);
  }
  W.play = function () {
    if (!audio) return;
    try { audio.volume = 0; } catch (e) { /* iOS */ }
    setMusicUI(true);
    var p = audio.play();
    if (p && p.then) {
      p.then(function () { fadeTo(0.8, 2600); }).catch(function () { setMusicUI(false); });
    } else {
      fadeTo(0.8, 2600);
    }
  };
  W.pause = function () {
    if (!audio) return;
    setMusicUI(false);
    if (document.hidden) { audio.pause(); return; }
    fadeTo(0, 380, function () { audio.pause(); });
  };
  function toggleMusic() {
    if (root.classList.contains('music-on')) { W.userPaused = true; W.pause(); }
    else { W.userPaused = false; W.play(); }
  }
  document.addEventListener('visibilitychange', function () {
    if (!audio) return;
    if (document.hidden) {
      if (!audio.paused) { resumeOnShow = true; audio.pause(); }
    } else if (resumeOnShow) {
      resumeOnShow = false;
      if (!W.userPaused && root.classList.contains('music-on')) {
        var p = audio.play();
        if (p && p.catch) p.catch(function () { setMusicUI(false); });
      }
    }
  });

  /* ---------- reveal on scroll ---------- */
  function startReveal() {
    var els = $$('.rv');
    if (!('IntersectionObserver' in window) || reduce) {
      els.forEach(function (e) { e.classList.add('in'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
      });
    }, { threshold: 0.14, rootMargin: '0px 0px -6% 0px' });
    els.forEach(function (e) { io.observe(e); });
  }

  /* ---------- scroll hooks ---------- */
  var scrollFns = [], ticking = false;
  W.onScroll = function (fn) { scrollFns.push(fn); };
  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      var y = window.pageYOffset || document.documentElement.scrollTop;
      for (var i = 0; i < scrollFns.length; i++) scrollFns[i](y);
    });
  }, { passive: true });

  /* ---------- canvas loop helper (pauses off-screen) ---------- */
  W.canvas = function (canvas, api) {
    var ctx = canvas.getContext('2d');
    var w = 0, h = 0, raf = 0, running = false, ready = false;
    function resize() {
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      var r = canvas.getBoundingClientRect();
      if (!r.width || !r.height) return;
      var first = !ready || Math.abs(r.width - w) > 40;
      w = r.width; h = r.height;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (first && api.setup) api.setup(w, h);
      ready = true;
      if (reduce) api.draw(ctx, w, h, 0);
    }
    function frame(t) {
      if (!running) return;
      api.draw(ctx, w, h, t);
      raf = requestAnimationFrame(frame);
    }
    function start() {
      if (running || reduce) return;
      if (!ready) resize();
      running = true;
      raf = requestAnimationFrame(frame);
    }
    function stop() { running = false; cancelAnimationFrame(raf); }
    resize();
    window.addEventListener('resize', resize);
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (e) {
        if (e[0].isIntersecting) start(); else stop();
      }).observe(canvas);
    } else start();
    return { start: start, stop: stop, resize: resize };
  };

  /* ---------- open sequence ---------- */
  W.heroGo = function () { root.classList.add('hero-go'); };
  W.open = function () {
    if (W.opened) return;
    W.opened = true;
    if (!W.userPaused) W.play();
    root.classList.add('is-opening');
    var finished = false;
    function finish() {
      if (finished) return;
      finished = true;
      root.classList.remove('is-locked', 'is-opening');
      root.classList.add('is-open', 'hero-go');
      var g = $('#gate');
      if (g) g.hidden = true;
      startReveal();
      if (W.opts.onOpened) W.opts.onOpened();
    }
    if (W.opts.onOpen) W.opts.onOpen(finish); else finish();
    setTimeout(finish, 6000);
  };

  W.init = function (opts) {
    W.opts = opts || {};
    var extra = W.opts.text || {};
    ['uz', 'ru'].forEach(function (l) {
      var src = extra[l] || {};
      for (var k in src) if (Object.prototype.hasOwnProperty.call(src, k)) TEXT[l][k] = src[k];
    });
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
    root.classList.add('is-locked');
    if (reduce) root.classList.add('reduce');
    else if ('IntersectionObserver' in window) root.classList.add('rv-on');

    audio = $('#bgm');
    $$('[data-music]').forEach(function (b) { b.addEventListener('click', toggleMusic); });
    $$('[data-lang]').forEach(function (b) {
      b.addEventListener('click', function () { W.setLang(b.getAttribute('data-lang')); });
    });
    $$('[data-href="map"]').forEach(function (a) {
      a.href = MAP_URL; a.target = '_blank'; a.rel = 'noopener';
    });
    $$('[data-href="navi"]').forEach(function (a) {
      a.href = NAVI_URL; a.target = '_blank'; a.rel = 'noopener';
    });
    $$('[data-href="gcal"]').forEach(function (a) { a.target = '_blank'; a.rel = 'noopener'; });

    var l = 'uz';
    try {
      var saved = localStorage.getItem('ys-lang');
      if (saved && TEXT[saved]) l = saved;
    } catch (e) { /* storage unavailable */ }
    W.setLang(l);
    renderCountdown(true);
    setInterval(renderCountdown, 1000);

    $$('[data-open]').forEach(function (b) { b.addEventListener('click', W.open); });
    requestAnimationFrame(function () { root.classList.add('is-ready'); });
  };
})();

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  function f(n) { return Math.round(n * 100) / 100; }
  function gcd(a, b) { return b ? gcd(b, a % b) : a; }

  /* star polygon {n/k} as one path (several closed loops when n and k share a factor) */
  function starPoly(cx, cy, n, k, r, rot) {
    var g = gcd(n, k), m = n / g, d = '';
    for (var s = 0; s < g; s++) {
      for (var i = 0; i <= m; i++) {
        var a = rot + ((s + i * k) % n) * 2 * Math.PI / n;
        d += (i ? 'L' : 'M') + f(cx + r * Math.cos(a)) + ' ' + f(cy + r * Math.sin(a));
      }
    }
    return d;
  }
  function circ(cx, cy, r) { return 'M' + f(cx - r) + ' ' + cy + 'a' + r + ' ' + r + ' 0 1 0 ' + f(2 * r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + f(-2 * r) + ' 0'; }
  function rosette(target, layers) {
    layers.forEach(function (d, i) {
      var p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d);
      p.setAttribute('pathLength', '1');
      p.style.setProperty('--i', i);
      target.appendChild(p);
    });
  }
  var R = -Math.PI / 2, H = Math.PI / 8;
  rosette(W.$('#rosette g'), [
    starPoly(200, 200, 8, 3, 44, R),
    starPoly(200, 200, 8, 2, 68, R + H),
    circ(200, 200, 84),
    starPoly(200, 200, 16, 5, 128, R),
    circ(200, 200, 140),
    starPoly(200, 200, 16, 3, 172, R + H / 2),
    circ(200, 200, 180)
  ]);
  rosette(W.$('#miniRosette'), [
    starPoly(200, 200, 8, 3, 70, R),
    starPoly(200, 200, 8, 2, 110, R + H),
    circ(200, 200, 140),
    starPoly(200, 200, 16, 5, 190, R)
  ]);

  /* night sky: twinkling stars and an occasional shooting star */
  function sky(canvas, n, shooting) {
    var stars = [], last = 0, shoot = null, next = 2600;
    return W.canvas(canvas, {
      setup: function (w, h) {
        stars = [];
        for (var i = 0; i < n; i++) {
          stars.push({ x: Math.random() * w, y: Math.random() * h, r: 0.35 + Math.random() * 1.15, p: Math.random() * 6.28, s: 0.4 + Math.random() * 1.6, gold: Math.random() < 0.3 });
        }
      },
      draw: function (ctx, w, h, t) {
        var dt = last ? Math.min(3, (t - last) / 16.7) : 1;
        last = t;
        ctx.clearRect(0, 0, w, h);
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          ctx.globalAlpha = 0.2 + 0.8 * (0.5 + 0.5 * Math.sin(t * 0.0016 * s.s + s.p));
          ctx.fillStyle = s.gold ? '#f3d995' : '#e8edfb';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, 6.2832);
          ctx.fill();
        }
        if (shooting) {
          if (!shoot && t > next) shoot = { x: w * (0.15 + Math.random() * 0.5), y: h * (0.05 + Math.random() * 0.25), vx: 6 + Math.random() * 3, vy: 2.4 + Math.random() * 1.4, life: 0 };
          if (shoot) {
            shoot.life += dt;
            shoot.x += shoot.vx * dt;
            shoot.y += shoot.vy * dt;
            var a = Math.max(0, 1 - shoot.life / 46);
            var g = ctx.createLinearGradient(shoot.x, shoot.y, shoot.x - shoot.vx * 14, shoot.y - shoot.vy * 14);
            g.addColorStop(0, 'rgba(255,244,214,' + a + ')');
            g.addColorStop(1, 'rgba(255,244,214,0)');
            ctx.globalAlpha = 1;
            ctx.strokeStyle = g;
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(shoot.x, shoot.y);
            ctx.lineTo(shoot.x - shoot.vx * 14, shoot.y - shoot.vy * 14);
            ctx.stroke();
            if (shoot.life > 46) { shoot = null; next = t + 5000 + Math.random() * 6000; }
          }
        }
        ctx.globalAlpha = 1;
      }
    });
  }
  sky(W.$('#gateFx'), 90, false);
  sky(W.$('#heroFx'), 80, true);

  W.init({
    text: {
      uz: {
        gateTitle: 'Eshigimiz siz uchun ochiq',
        gateHint: 'Eshikni ochish uchun bosing',
        openAria: 'Eshikni ochish',
        heroDay: 'Shanba · soat 18:00'
      },
      ru: {
        gateTitle: 'Наши двери открыты для вас',
        gateHint: 'Нажмите, чтобы открыть двери',
        openAria: 'Открыть двери',
        heroDay: 'Суббота · 18:00'
      }
    },
    calMark: '<svg class="cal-star" viewBox="0 0 100 100" aria-hidden="true"><use href="#s8" fill="url(#goldG)"/></svg>',
    onOpen: function (done) {
      var gate = W.$('#gate');
      if (W.reduce) {
        W.heroGo();
        gate.classList.add('fade-out');
        setTimeout(done, 700);
        return;
      }
      gate.classList.add('s1');
      setTimeout(function () { gate.classList.add('s2'); }, 1150);
      setTimeout(function () { W.heroGo(); gate.classList.add('s3'); }, 2050);
      setTimeout(done, 2750);
    }
  });

  if (!W.reduce) {
    var hero = W.$('#top'), heroIn = W.$('#heroIn');
    W.onScroll(function (y) {
      var h = hero.offsetHeight || 1;
      var k = Math.min(1, y / (h * 0.75));
      heroIn.style.opacity = String(1 - k * 0.95);
      heroIn.style.transform = 'translate3d(0,' + (y * 0.3).toFixed(1) + 'px,0) scale(' + (1 - k * 0.05).toFixed(3) + ')';
    });
  }
})();
